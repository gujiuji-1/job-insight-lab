[project]
name = "job-insight-lab"
version = "2.2.0"
description = "岗位数据分析与报告工具 — 结构化 JD、增量数据保护与聚合图表"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "eatmoreduck" }
]
maintainers = [
    { name = "gujiuji-1" }
]

keywords = ["zhipin", "boss", "scraper", "cdp", "jobs"]

dependencies = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.optional-dependencies]
all = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.scripts]
# 模块路径对应 [tool.hatch.build.targets.wheel] 的 packages=["scripts"]，
# 安装后顶层包名为 scripts，故入口是 scripts.boss_cdp_raw:main
boss-scraper = "scripts.boss_cdp_raw:main"
boss-summary = "scripts.job_summary:main"

[project.urls]
Repository = "https://github.com/gujiuji-1/job-insight-lab"
Upstream = "https://github.com/eatmoreduck/boss-zhipin-scraper"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
# 城市码表 data/city_codes.json 打进 wheel，pip install 后也能读到（见 issue #24）
force-include = { "data/city_codes.json" = "data/city_codes.json" }
